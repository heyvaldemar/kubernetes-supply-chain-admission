# What an image needs before it runs in a verified namespace, checked by
# Kyverno at admission against the registry and Sigstore's transparency log:
#
#   - a signature by this repository's publish workflow on main
#     (cosign keyless: the identity is the workflow, not a key anyone holds)
#   - signed SLSA provenance that says it was built from this repository
#   - a signed CycloneDX SBOM
#   - a signed vulnerability scan that read an operating system's packages
#     and found nothing critical
#   - a reference by digest, so what was verified is what runs
#
# Every image in the pod is matched (glob "*"): an image from anywhere else,
# signed by anyone else, is refused for the same reason an unsigned one is.
# Every image the pod uses, that is: its containers, its init containers,
# the ephemeral containers `kubectl debug` adds to it through the pod's
# ephemeralcontainers subresource, and its image volumes, whose files the
# signed process reads. Kyverno 1.19.1 and 1.19.2 extract the first three and no image
# volume (kyverno/kyverno#17555 would have; it was closed unmerged on
# 2026-10-22), so `images` below adds them, and every validation reads all
# four (ADR 6).
#
# For a cosign in-toto attestation, extractPayload() returns the whole in-toto
# statement in Kyverno 1.19.1 and 1.19.2, so the attestation's content is under
# .predicate. The documentation's example reads .bomFormat at the top level,
# which is right for the Notary referrer it declares, whose payload is the SBOM
# itself; written that way here, the path finds nothing.
apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-images
spec:
  validationActions: [Deny]
  failurePolicy: Fail
  webhookConfiguration:
    # The API server's maximum. One verified admission reads the image's
    # bundles from the registry for the signature and for each attestation,
    # and took 4 to 26 seconds in the e2e runs; past this the request fails
    # closed and the pod's controller creates it again.
    timeoutSeconds: 30
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        supply-chain.heyvaldemar.com/verified: "true"
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods, pods/ephemeralcontainers]
  matchImageReferences:
    - glob: "*"
  images:
    - name: volumes
      expression: >-
        object.spec.?volumes.orValue([]).filter(v, has(v.image)).map(v, v.image.reference)
  validationConfigurations:
    verifyDigest: true
    mutateDigest: false
    required: true
  attestors:
    - name: publisher
      cosign:
        keyless:
          identities:
            - subject: https://github.com/heyvaldemar/kubernetes-supply-chain-admission/.github/workflows/publish.yml@refs/heads/main
              issuer: https://token.actions.githubusercontent.com
        # No ctlog block. The transparency log is still required: with none,
        # Kyverno takes Rekor's public key from Sigstore's TUF root and checks
        # the inclusion proof each bundle carries, offline. A ctlog.url makes
        # it build an online Rekor client instead, and puts Rekor on the
        # admission path.
  attestations:
    - name: provenance
      intoto:
        type: https://slsa.dev/provenance/v1
    - name: sbom
      intoto:
        type: https://cyclonedx.org/bom
    - name: scan
      intoto:
        type: https://cosign.sigstore.dev/attestation/vuln/v1
  validations:
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, verifyImageSignatures(image, [attestors.publisher])).all(n, n > 0)
      message: every image is signed by this repository's publish workflow on main
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, verifyAttestationSignatures(image, attestations.provenance, [attestors.publisher])).all(n, n > 0) &&
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, extractPayload(image, attestations.provenance).predicate.buildDefinition.resolvedDependencies
          .exists(d, d.uri.startsWith('git+https://github.com/heyvaldemar/kubernetes-supply-chain-admission@'))).all(ok, ok)
      message: every image carries signed provenance that says it was built from this repository
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, verifyAttestationSignatures(image, attestations.sbom, [attestors.publisher])).all(n, n > 0) &&
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, extractPayload(image, attestations.sbom).predicate.bomFormat == 'CycloneDX').all(ok, ok)
      message: every image carries a signed CycloneDX SBOM
    - expression: >-
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, verifyAttestationSignatures(image, attestations.scan, [attestors.publisher])).all(n, n > 0) &&
        (images.containers + images.initContainers + images.ephemeralContainers + images.volumes).map(image, extractPayload(image, attestations.scan).predicate.scanner.result).all(r,
          has(r.Results) && r.Results.exists(t, t.Class == 'os-pkgs') &&
          r.Results.all(t, !has(t.Vulnerabilities) || t.Vulnerabilities.all(v, v.Severity != 'CRITICAL')))
      message: every image carries a signed scan that read its operating system's packages and found nothing critical
