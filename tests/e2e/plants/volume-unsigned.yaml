# expect: every image is signed by this repository's publish workflow on main
# The signed image, and an image nobody signed mounted as a volume beside
# it: whatever its files hold, the signed process reads.
apiVersion: v1
kind: Pod
metadata:
  name: volume-unsigned
  namespace: workloads
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: IMAGE_APP
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      volumeMounts:
        - {name: content, mountPath: /content, readOnly: true}
  volumes:
    - name: content
      image: {reference: IMAGE_UNSIGNED, pullPolicy: IfNotPresent}
