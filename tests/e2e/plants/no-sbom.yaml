# expect: every image carries a signed CycloneDX SBOM
# Signed by the publish workflow, with provenance and a scan, and no SBOM.
apiVersion: v1
kind: Pod
metadata:
  name: no-sbom
  namespace: workloads
spec:
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: app
      image: IMAGE_NO_SBOM
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
