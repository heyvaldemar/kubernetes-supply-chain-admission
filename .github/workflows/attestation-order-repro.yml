name: Kyverno attestation order (reproduction)

# A reproduction for Kyverno's ImageValidatingPolicy path of
# kyverno/kyverno#18000, not part of this repository's checks. It builds one
# image, attests it twice with the same predicate type ("first", then
# "second"), and asks Kyverno 1.19.1 under two orders of the registry's
# referrers index. The policy admits only when extractPayload() returns the
# newer attestation. repro/attestation-order/README.md says what it shows.
#
# Started by hand, on main only: the attestations are signed keylessly with
# this workflow's identity on main, which is the identity the policy names.
# A fork runs it under its own identity.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: attestation-order-repro
  cancel-in-progress: false

jobs:
  repro:
    name: Same attestations, two index orders, two answers
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Push the image, and rewrite its referrers index.
      packages: write
      # The OIDC token cosign exchanges for a signing certificate.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}/attestation-order
      PREDICATE_TYPE: https://github.com/heyvaldemar/kubernetes-supply-chain-admission/repro/attestation-order/v1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GitHub's registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: One image, attested twice with the same type
        run: |
          # A registry path is lowercase; a fork's owner may not be.
          IMAGE="${IMAGE,,}"
          # A new digest each run, so every run starts with exactly two attestations.
          printf 'FROM docker.io/library/alpine:3.22@sha256:5291449c3df73caf6ed85e649dec1b9e818b39a5d8c871e97afc13e9cd5e8fa8\nLABEL run="%s"\n' "$GITHUB_RUN_ID" \
            | docker buildx build --push --provenance=false --sbom=false \
                --metadata-file "$RUNNER_TEMP/meta.json" -t "$IMAGE:repro" -
          ref="$IMAGE@$(jq -r '."containerimage.digest"' "$RUNNER_TEMP/meta.json")"
          for which in first second; do
            printf '{"which":"%s"}\n' "$which" > "$RUNNER_TEMP/$which.json"
            cosign attest --yes --type "$PREDICATE_TYPE" --predicate "$RUNNER_TEMP/$which.json" "$ref"
            # Distinct created annotations, so "newer" is unambiguous.
            sleep 2
          done
          echo "REF=$ref" >> "$GITHUB_ENV"

      - name: Create the kind cluster
        run: kind create cluster --config kind/cluster.yaml --wait 120s

      - name: Install Kyverno
        run: ./scripts/install-kyverno.sh

      - name: Ask Kyverno under both orders
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          {
            echo "### Kyverno attestation order"
            echo
            echo "Image: \`$REF\`"
            echo
            echo '```'
            ./repro/attestation-order/run.sh "$REF"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: What Kyverno logged
        if: always()
        run: kubectl -n kyverno logs deployment/kyverno-admission-controller --tail=60 || true
